 <!DOCTYPE html>
 <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="styles.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/bulma.css">
  </head>
  <body>
    <div class="selection-buttons">
     <input id="file-chooser" class="button is-dark" type="file" name="Choose Files" value="Choose Files"> 
    </div>
    <div class="file-pages">
      <input type="checkbox" name="first-page-only" value="first-page-only" checked>
      <label for="first-page-only">First Page Only</label>
    </div>
    <div class="format-choice">
    <label for="format">Choose Format :</label>
    <select for="format">
      <option value="jpg">JPG</option>
      <option value="png">PNG</option>
    </select>
    </div>
    <div class="convert-button">
      <button type="submit" class="button is-dark">Convert</button>
    </div>
    <div>
      <p class="file-name"></p>
    </div>
    <script>
      let fileName = document.querySelector('.file-name')
      fileName.style.color = "white"
      fileName.style.fontSize = "30px"
      fileName.textContent = 'uud'
      let fileChooser = document.querySelector('#file-chooser').addEventListener('change', (event) => {
        const filePath = event.target.files[0].path
        fileName.textContent = `${filePath}`
      })
    </script>
  </body>
 </html>
